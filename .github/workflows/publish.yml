name: Publish container image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/oberones/wasteland-flight-simulator-js

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Run before checkout, container builds, or registry authentication.
      - name: Require a stable version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF_TYPE" != tag ]] ||
             [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Expected a stable vMAJOR.MINOR.PATCH tag without leading zeros.'
            exit 1
          fi
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify linux/${{ matrix.arch }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose --file deploy/compose.production.yml config --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: wasteland-flight-simulator:smoke-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
          cache-from: type=gha,scope=wfs-${{ matrix.arch }}
          cache-to: type=gha,scope=wfs-${{ matrix.arch }},mode=max

      - name: Smoke-test hardened container
        env:
          ARCH: ${{ matrix.arch }}
        run: bash .github/scripts/smoke-container.sh "wasteland-flight-simulator:smoke-$ARCH" "linux/$ARCH" wfs-container-smoke

      # The script also traps failures/signals; this covers interrupted steps.
      - name: Remove test container
        if: always()
        run: docker rm --force wfs-container-smoke >/dev/null 2>&1 || true

  publish:
    name: Publish multi-platform image
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Serialize registry writes; latest follows publication order, not SemVer order.
    concurrency:
      group: wfs-ghcr-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.validate.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
          cache-from: |
            type=gha,scope=wfs-amd64
            type=gha,scope=wfs-arm64
            type=gha,scope=wfs-publish
          cache-to: type=gha,scope=wfs-publish,mode=max

      - name: Report published digest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            printf '### Published container image\n\n'
            printf -- '- Image: `%s`\n' "$IMAGE"
            printf -- '- Tags: `%s`, `sha-%s`, `latest`\n' "$VERSION" "$GITHUB_SHA"
            printf -- '- Platforms: `linux/amd64`, `linux/arm64`\n'
            printf -- '- Digest: `%s@%s`\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
